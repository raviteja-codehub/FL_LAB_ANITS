<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Fix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar" id="nav"></div>
  <div class="container">
    <div class="panel wide">
      <h2>Create Account</h2>
      <form id="registerForm">
        <label>Full Name</label><input name="name" required>
        <div class="row">
          <div><label>Age</label><input type="number" name="age" min="1" required></div>
          <div><label>Date of Birth</label><input type="date" name="dob" required></div>
        </div>
        <div class="row">
          <div><label>Gender</label>
            <select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
          <div><label>Mobile Number</label><input name="mobile" pattern="[0-9]{10}" title="10 digit number" required></div>
        </div>
        <label>Email</label><input type="email" name="email" required>
        <div class="row">
          <div><label>Username</label><input name="username" required></div>
          <div><label>Password</label><input type="password" name="password" required></div>
        </div>
        <label>Address</label><textarea name="address" required></textarea>
        <button class="btn" type="submit">Register</button>
      </form>
      <p id="msg"></p>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
