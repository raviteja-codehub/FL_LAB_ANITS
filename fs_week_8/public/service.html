<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Fix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar" id="nav"></div>
  <div class="container">
    <div class="panel wide">
      <h2 id="title"></h2>
      <p id="desc"></p>
      <form id="bookForm">
        <div class="row">
          <div><label>Date</label><input type="date" name="date" id="date" required></div>
          <div><label>Time</label><input type="time" name="time" required></div>
        </div>
        <label>Address</label><input name="address" required>
        <label>Notes (optional)</label><textarea name="notes"></textarea>
        <button class="btn" type="submit">Book Now</button>
      </form>
      <p id="msg"></p>
    </div>
    <h3 style="text-align:center">Your Bookings</h3>
    <div class="list" id="list"></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
