<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - FixApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">🔧 FixApp</div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/register">Register</a>
      <a href="/login">Login</a>
    </div>
  </nav>

  <section class="form-section">
    <div class="form-card">
      <h2>Create Your Account</h2>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required />
          </div>
          <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" min="1" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" required />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required />
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="mobile" pattern="[0-9]{10}" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required />
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea name="address" rows="2" required></textarea>
        </div>

        <p id="registerMessage" class="message"></p>
        <button type="submit" class="btn btn-primary full-width">Register</button>
      </form>
      <p class="switch-link">Already have an account? <a href="/login">Login here</a></p>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
